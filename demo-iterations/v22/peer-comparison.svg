<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#f4f2ec"/><text x="120" y="140" font-family="DejaVu Sans" font-weight="700" font-size="34" fill="#174d43" letter-spacing="3">ONE PREPARED FICTIONAL PEER EXAMPLE</text><text x="120" y="230" font-family="DejaVu Serif" font-size="68" fill="#20342c">Ravi</text>
<rect x="120" y="300" width="810" height="520" rx="28" fill="#e6eee8" stroke="#174d43" stroke-width="3"/><rect x="990" y="300" width="810" height="520" rx="28" fill="#fffefa" stroke="#b3c4b7" stroke-width="3"/>
<text x="180" y="390" font-family="DejaVu Sans" font-weight="700" font-size="34" fill="#174d43">MATCH</text><text x="180" y="500" font-family="DejaVu Sans" font-size="48" fill="#20342c"><tspan x="180" dy="0">Both faced pressure to</tspan><tspan x="180" dy="66">answer before they were</tspan><tspan x="180" dy="66">ready, and wanted room</tspan><tspan x="180" dy="66">to think.</tspan></text>
<text x="1050" y="390" font-family="DejaVu Sans" font-weight="700" font-size="34" fill="#174d43">DIFFERENCE</text><text x="1050" y="500" font-family="DejaVu Sans" font-size="48" fill="#20342c"><tspan x="1050" dy="0">Ravi asked a trusted friend</tspan><tspan x="1050" dy="66">to listen. Arjun has not</tspan><tspan x="1050" dy="66">said he has that support.</tspan></text>
<text x="120" y="930" font-family="DejaVu Sans" font-size="30" fill="#374b41">Prepared fictional example · not a real account · not live</text><text x="120" y="986" font-family="DejaVu Sans" font-size="26" fill="#526158">A comparison for reflection, not a promise that the same approach will help.</text>
</svg>
